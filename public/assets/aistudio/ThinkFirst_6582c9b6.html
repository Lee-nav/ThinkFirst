<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ThinkFirst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono&amp;family=Instrument+Sans:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1E8;--card:#fff;--ink:#17181C;--mut:#686A72;--line:#E2DDD0;--acc:#1F7A5C;--onacc:#fff;--accl:#DEEEE7;--amb:#E29628;--ambl:#FBEED6;--ambt:#8A530A;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Instrument Serif",Georgia,serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--card:#1C1E23;--ink:#F2EFE8;--mut:#9A9CA5;--line:#2C2E35;--acc:#3FB68D;--onacc:#0B1E17;--accl:#173229;--amb:#E8A33D;--ambl:#3A2C12;--ambt:#EDB964;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121316;--card:#1C1E23;--ink:#F2EFE8;--mut:#9A9CA5;--line:#2C2E35;--acc:#3FB68D;--onacc:#0B1E17;--accl:#173229;--amb:#E8A33D;--ambl:#3A2C12;--ambt:#EDB964;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font:400 26px var(--serif)}
.pill{font:12px var(--mono);color:var(--mut);display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc);display:inline-block}
.main{padding-bottom:230px}
h1{font:400 42px/1.06 var(--serif);margin:30px 0 22px;letter-spacing:-.01em}
h2{font:400 30px/1.1 var(--serif);margin:18px 0 14px}
.pt{margin-top:26px}
.mut{color:var(--mut)}.sm{font-size:13px;color:var(--mut);display:block}
.lbl{font:10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;resize:none;outline:none}
input:focus,textarea:focus{border-color:var(--acc)}
#topic{height:56px}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 20px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);font-weight:500;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{height:56px;width:100%;border:0;border-radius:28px;background:var(--acc);color:var(--onacc);font-weight:600;font-size:17px;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn:disabled{background:var(--line);color:var(--mut);cursor:not-allowed}
.link{width:100%;background:none;border:0;color:var(--mut);font-weight:500;font-size:14px;min-height:44px;cursor:pointer}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#cta{max-width:520px;margin:0 auto;padding:12px 20px 0}#cta:empty{display:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);max-width:520px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;min-height:58px;background:none;border:0;color:var(--mut);font-weight:500;font-size:11px;cursor:pointer}
.tab[aria-current=page]{color:var(--acc)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.steps,.sl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps{margin:6px 0 5px}.sl{font:9.5px var(--mono);color:var(--mut);text-transform:uppercase}.sl .on{color:var(--ink)}
.seg{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.seg i{display:block;height:100%;background:var(--acc);transition:width .5s}
.resume{width:100%;text-align:left;background:var(--accl);border:0;border-radius:18px;padding:16px;cursor:pointer;display:block;margin-top:8px}
.resume .lbl{color:var(--acc)}.resume b{display:block;font-size:17px;margin:2px 0}
.bar{display:block;height:5px;border-radius:3px;background:var(--card);margin-top:10px}.bar i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.f{display:block;position:relative;margin-bottom:12px}.f:focus-within{border-color:var(--acc)}
.f textarea{border:0;padding:8px 30px 0 0;border-radius:0;background:none;min-height:60px}
.tick{position:absolute;right:14px;top:14px;width:20px;height:20px;border-radius:50%;background:var(--acc);display:none}
.tick::after{content:"";position:absolute;left:6.5px;top:3.5px;width:4px;height:8px;border:solid var(--onacc);border-width:0 2px 2px 0;transform:rotate(45deg)}
.f.ok .tick{display:block}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:10px 0 0}
.chat{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.b{max-width:84%;padding:11px 15px;border-radius:18px;font-size:15px;animation:in .25s}
.b.s{align-self:flex-end;background:var(--ink);color:var(--bg)}
.b.c{align-self:flex-start;background:var(--card);border:1.5px solid var(--line)}
.b.r{align-self:flex-start;background:var(--ambl);border:2px solid var(--amb)}.b.r b{display:block}
.typing{display:flex;gap:5px;padding:15px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.ask{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.ask input{flex:1;height:52px;border-radius:26px;padding:0 18px}
.hintb{height:52px;padding:0 14px;border-radius:26px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font-weight:500;font-size:13px;cursor:pointer}
.send{width:52px;height:52px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:22px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.row .link{width:auto;padding:0 6px}
#dr{min-height:240px;line-height:1.6}
.tl{position:relative;margin-top:16px;padding-left:32px}
.tl::before{content:"";position:absolute;left:8px;top:16px;bottom:16px;width:2px;background:var(--line)}
.sn{position:relative;margin-bottom:14px}.sn p{margin:0;padding:6px 0}
.sn.f p{background:var(--ambl);padding:10px 12px;border-radius:12px}
.dt{position:absolute;left:-32px;top:10px;width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--bg)}
.sn.f .dt{background:var(--amb)}
.sn.f::after{content:"";position:absolute;left:-26px;top:24px;bottom:20px;width:2px;background:var(--amb)}
.fb{margin-top:8px;border:1.5px solid var(--amb);border-radius:12px;padding:10px 12px;background:var(--card)}
.fb .lbl{display:block;color:var(--ambt)}
.ringw{position:relative;width:220px;margin:18px auto 12px}.ringw svg{width:100%;transform:rotate(-90deg);display:block}
.ringw circle{fill:none;stroke-width:22}.rb{stroke:var(--amb)}.rg{stroke:var(--acc);transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc b{font:400 56px/1 var(--serif)}.rc span{font-size:13px;color:var(--mut)}
.leg{display:flex;gap:18px;justify-content:center;font-size:13px;margin-bottom:18px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.end{text-align:center;color:var(--mut);margin:16px 0 0}
.li{width:100%;text-align:left;display:block;margin-bottom:10px;cursor:pointer;font:inherit;color:var(--ink)}.li b{display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats b{font:400 34px var(--serif);display:block}
.th,.tr{display:grid;grid-template-columns:56px 1fr 40px 44px;align-items:center;gap:10px;font-size:14px}
.th{padding:0 16px 8px;font:10px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.tr{padding:13px 16px}.tr+.tr{border-top:1px solid var(--line)}.tr b{font-weight:600}
.pb{display:flex;align-items:center;gap:8px;font:11px var(--mono);color:var(--mut)}
.pb i{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:block}.pb i u{display:block;height:100%;background:var(--acc)}
.pb.w i u{background:var(--amb)}.tr .m{font:12px var(--mono)}.tr .m:last-child{text-align:right}
.p0{padding:0;margin-top:6px}.rl{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;min-height:56px}.rl+.rl{border-top:1px solid var(--line)}
.sw{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.sw[aria-checked=true]{background:var(--acc)}.sw[aria-checked=true]::after{left:23px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:40;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><span class="brand">ThinkFirst</span><span class="pill" id="rt"></span></div></header>
<main class="wrap main" id="app"></main>
<div class="dock"><div id="cta"></div>
<nav class="tabs" aria-label="Main">
<button class="tab" data-a="tab" data-v="home"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg>Write</button>
<button class="tab" data-a="tab" data-v="drafts"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></svg>Drafts</button>
<button class="tab" data-a="tab" data-v="progress"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 018 8"/></svg>Progress</button>
<button class="tab" data-a="tab" data-v="teacher"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6M16 5a3 3 0 010 6M18 14c2 .6 3 2.6 3 6"/></svg>Teacher</button>
</nav></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),app=$("#app"),cta=$("#cta");
const wc=s=>(s.trim().match(/\S+/g)||[]).length;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const K="thinkfirst.v1";
function load(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}}
const st=Object.assign({view:"home",type:"Essay",topic:"",o:["","",""],chat:[],stage:0,draft:"",step:1,t0:0,sw:0,hn:0,done:false,res:null,shared:false,hist:[],rules:[1,0]},load());
st.view="home";
function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
let tm;
const HINTS=["One reason this matters is","For example, in my town","This shows that","Some people disagree because"];
const QS=["What is one example that proves it? Name a place, a number, or a person.","Strong. Now write your first paragraph in the draft. I’ll check it after you finish."];
const REF=/\b(write|generate|finish|compose)\b.{0,25}\b(essay|paragraph|report|reflection|it|this|answer|everything)\b|\b(give|show)\b.{0,12}\b(sample|answer|final)\b|\bfor me\b|ignore (your|the) rules|model answer|i am the teacher/i;
const ST=["Outline","Draft","Revise","Summary"],TAB={drafts:1,progress:1,teacher:1};
const head=n=>`<div class="lbl">${n>4?"Complete":"Step "+n+" of 4"}</div><div class="steps">${ST.map((_,i)=>`<div class="seg"><i style="width:${i<n-1?100:i==n-1?50:0}%"></i></div>`).join("")}</div><div class="sl">${ST.map((s,i)=>`<span class="${i<n?"on":""}">${s}</span>`).join("")}</div>`;
const bub=m=>`<div class="b ${m.r}">${m.r=="r"?"<b>I won’t write it for you.</b>":""}${esc(m.t)}</div>`;
const sents=t=>(t.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[]).map(s=>s.trim()).filter(Boolean);
function fb(s,p){const n=wc(s);if(n>22)return"Too long. Try splitting it in two.";if(n<4)return"Too short. Add one detail.";if(p&&s.split(/\s+/)[0].toLowerCase()==p.split(/\s+/)[0].toLowerCase())return"Starts like the sentence before. Vary the opening.";return""}
const OL=[["Main point","What do you want to say?"],["Example","A place, a number, or a name"],["Counterpoint","What would someone argue back?"]];

const V={
home:()=>{const r=st.topic&&!st.done;return `${r?`<button class="resume" data-a="resume"><span class="lbl">Resume</span><b>${esc(st.topic)}</b><span class="sm">Step ${st.step} of 4</span><span class="bar"><i style="width:${st.step*25-12}%"></i></span></button>`:""}<h1>What are you<br>writing about?</h1><input id="topic" placeholder="Type your topic" autocomplete="off" aria-label="Topic"><div class="chips" role="group" aria-label="Type">${["Essay","Report","Reflection"].map(t=>`<button class="chip" data-a="type" data-t="${t}" aria-pressed="${st.type==t}">${t}</button>`).join("")}</div>`},
outline:()=>head(1)+`<h2>Your outline</h2>`+OL.map((x,i)=>`<label class="card f"><span class="lbl">${x[0]}</span><textarea rows="2" data-i="${i}" placeholder="${x[1]}. Messy notes are fine.">${esc(st.o[i])}</textarea><span class="tick"></span></label>`).join(""),
coach:()=>head(2)+`<h2>Coach</h2><div class="chat" id="chat" aria-live="polite">${st.chat.map(bub).join("")}</div>`,
draft:()=>head(2)+`<h2>Draft</h2><textarea id="dr" placeholder="Write your first paragraph here. Your words only." aria-label="Draft">${esc(st.draft)}</textarea><div class="row"><span class="lbl" id="wcn">${wc(st.draft)} words</span><button class="link" data-a="hint" data-for="dr">Hint</button></div>`,
review:()=>{const ss=sents(st.draft);let p="",ok=0;const h=ss.map(s=>{const f=fb(s,p);p=s;if(!f)ok++;return `<div class="sn${f?" f":""}"><i class="dt"></i><p>${esc(s)}</p>${f?`<div class="fb"><span class="lbl">Feedback</span><b>${f}</b></div>`:""}</div>`}).join("");return head(3)+`<h2>Review</h2><p class="mut" style="margin:0">${ok} of ${ss.length} sentences clear</p><div class="tl">${h}</div>`},
summary:()=>{const r=st.res;return head(5)+`<div class="ringw"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="rb" cx="100" cy="100" r="80"/><circle class="rg" id="rg" cx="100" cy="100" r="80" stroke-dasharray="0 503"/></svg><div class="rc"><b id="pc">0%</b><span>your words</span></div></div><div class="leg"><span><i style="background:var(--acc)"></i>Your words</span><span><i style="background:var(--amb)"></i>Suggestions used</span></div><div class="card"><b>Thinking complete</b><span class="sm">${r.yw} words written · ${r.m} min · ${r.hn} hints</span></div><p class="end">${r.pct>=80?"You wrote it. The thinking was yours.":"Good work. Next time, try fewer hints."}</p>`},
drafts:()=>{const cur=st.topic&&!st.done?`<button class="card li" data-a="resume"><b>${esc(st.topic)}</b><span class="sm">${st.type} · In progress · ${wc(st.draft)} words</span></button>`:"";const old=st.hist.slice().reverse().map(h=>`<div class="card li"><b>${esc(h.topic)}</b><span class="sm">Done · ${h.pct}% your words</span></div>`).join("");return `<h2 class="pt">Drafts</h2>${cur+old||'<p class="mut">Nothing here yet. Start with a topic.</p>'}`},
progress:()=>{const h=st.hist,n=h.length,avg=n?Math.round(h.reduce((a,x)=>a+x.pct,0)/n):0,w=h.reduce((a,x)=>a+x.yw,0);return `<h2 class="pt">Progress</h2>${n?`<div class="stats"><div class="card"><b>${n}</b><span class="lbl">Finished</span></div><div class="card"><b>${avg}%</b><span class="lbl">Your words</span></div><div class="card"><b>${w}</b><span class="lbl">Words</span></div></div>`:'<p class="mut">Nothing to show yet. Finish a piece and your numbers appear here.</p>'}`},
teacher:()=>{const rows=[["Ana",92,"4/4","22m"],["Ben",88,"4/4","18m"],["Carla",95,"4/4","25m"],["Dan",61,"3/4","9m"],st.shared&&st.res?["You",st.res.pct,"4/4",st.res.m+"m"]:["Eli",90,"4/4","20m"]];return `<h2 class="pt">Essay 1 · Class</h2><div class="th"><span>Student</span><span>Words</span><span>Steps</span><span style="text-align:right">Time</span></div><div class="card p0">${rows.map(r=>`<div class="tr" data-r="${r.join(",")}"><b>${r[0]}</b><span class="pb${r[1]<70?" w":""}"><i><u style="width:${r[1]}%"></u></i>${r[1]}%</span><span class="m">${r[2]}</span><span class="m">${r[3]}</span></div>`).join("")}</div><p class="lbl" style="margin:22px 0 8px">Rules</p><div class="card p0">${["Require summary","Allow quick mode"].map((t,i)=>`<div class="rl">${t}<button class="sw" role="switch" aria-label="${t}" aria-checked="${!!st.rules[i]}" data-a="rule" data-i="${i}"></button></div>`).join("")}</div>`}
};
const C={
home:()=>`<button class="btn" id="go" data-a="start" disabled>Start thinking</button>`,
outline:()=>`<button class="btn" id="go" data-a="toCoach" disabled>Continue</button><p class="hint" id="hint">Add your own words to unlock</p>`,
coach:()=>`${st.stage>=2?`<button class="btn" data-a="toDraft" style="margin-bottom:10px">Open draft</button>`:""}<div class="ask"><input id="msg" placeholder="Type in your own words" autocomplete="off" aria-label="Message"><button class="hintb" data-a="hint" data-for="msg">Hint</button><button class="send" data-a="send" aria-label="Send">↑</button></div>`,
draft:()=>`<button class="btn" id="go" data-a="check" ${wc(st.draft)<8?"disabled":""}>Check my draft</button>`,
review:()=>`<button class="btn" data-a="finish">See my summary</button><button class="link" data-a="toDraft">Edit draft</button>`,
summary:()=>`<button class="btn" data-a="share" ${st.shared?"disabled":""}>${st.shared?"Shared with teacher":"Share with teacher"}</button><button class="link" data-a="new">Write another</button>`,
teacher:()=>`<button class="btn" data-a="export">Export report</button>`
};
const B={
home:()=>{const t=$("#topic");t.addEventListener("input",()=>{$("#go").disabled=t.value.trim().length<3})},
outline:()=>{const upd=()=>{document.querySelectorAll(".f").forEach((f,i)=>f.classList.toggle("ok",wc(st.o[i])>=3));const ok=wc(st.o[0])>=3&&wc(st.o[1])>=3;$("#go").disabled=!ok;$("#hint").style.visibility=ok?"hidden":"visible"};document.querySelectorAll(".f textarea").forEach(t=>t.addEventListener("input",()=>{st.o[+t.dataset.i]=t.value;save();upd()}));upd()},
coach:()=>{if(!st.chat.length)push({r:"c",t:`Your main point: “${st.o[0].trim()}”. Why should your reader care?`});scrollTo(0,document.body.scrollHeight)},
draft:()=>{const t=$("#dr");t.addEventListener("input",()=>{st.draft=t.value;save();$("#wcn").textContent=wc(t.value)+" words";$("#go").disabled=wc(t.value)<8})},
summary:()=>{const p=st.res.pct;requestAnimationFrame(()=>requestAnimationFrame(()=>{$("#rg").style.strokeDasharray=`${p*5.0265} 503`}));const el=$("#pc"),t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/1000);el.textContent=Math.round(p*k)+"%";if(k<1)requestAnimationFrame(f)})(t0)}
};
function drawCta(){cta.innerHTML=(C[st.view]||(()=>""))()}
function tick(){const el=$("#rt");if(!el||st.view!="draft")return;const r=Math.max(0,900-Math.floor((Date.now()-st.t0)/1000));el.innerHTML=`<i class="dot"></i>${Math.floor(r/60)}:${String(r%60).padStart(2,"0")}`}
function render(){
clearInterval(tm);
document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.v==(TAB[st.view]?st.view:"home")?"page":"false"));
app.innerHTML=V[st.view]();drawCta();
if(st.view=="draft"){if(!st.t0){st.t0=Date.now();save()}tick();tm=setInterval(tick,1000)}
else $("#rt").innerHTML=["outline","coach","review"].includes(st.view)?'<i class="dot"></i>Auto-saved':"";
B[st.view]&&B[st.view]()}
function go(v){st.view=v;save();render();scrollTo(0,0)}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2200)}
function push(m){st.chat.push(m);save();$("#chat").insertAdjacentHTML("beforeend",bub(m));scrollTo(0,document.body.scrollHeight)}
function send(){const el=$("#msg"),t=el.value.trim();if(!t)return;el.value="";push({r:"s",t});$("#chat").insertAdjacentHTML("beforeend",'<div class="b c typing" id="ty"><i></i><i></i><i></i></div>');scrollTo(0,document.body.scrollHeight);setTimeout(()=>reply(t),420)}
function reply(t){if(st.view!="coach")return;const y=$("#ty");y&&y.remove();
if(REF.test(t))push({r:"r",t:"In one sentence, what do you want to say?"});
else if(wc(t)<3)push({r:"c",t:"Add a few more words. Messy is fine."});
else if(st.stage<2){push({r:"c",t:QS[st.stage]});st.stage++;save();if(st.stage==2)drawCta()}
else push({r:"c",t:"Ready when you are. Open the draft."});
const m=$("#msg");m&&m.focus()}
function finish(){const tot=wc(st.o.join(" "))+st.chat.filter(m=>m.r=="s").reduce((a,m)=>a+wc(m.t),0)+wc(st.draft),sw=Math.min(st.sw,tot),yw=tot-sw;
st.res={pct:tot?Math.round(100*yw/tot):0,yw,sw,m:Math.max(1,Math.round((Date.now()-(st.t0||Date.now()))/60000)),hn:st.hn};
st.done=true;st.step=4;st.hist.push({topic:st.topic,pct:st.res.pct,yw});go("summary")}
const A={
tab:b=>go(b.dataset.v),
type:b=>{st.type=b.dataset.t;document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b))},
start:()=>{const t=$("#topic").value.trim();if(t.length<3)return;Object.assign(st,{topic:t,o:["","",""],chat:[],stage:0,draft:"",step:1,t0:0,sw:0,hn:0,done:false,res:null,shared:false});go("outline")},
resume:()=>go(st.done?"summary":st.step<2?"outline":st.step==2?(st.stage>=2||st.draft?"draft":"coach"):"review"),
toCoach:()=>{st.step=2;go("coach")},
toDraft:()=>{st.step=2;go("draft")},
hint:b=>{const el=$("#"+b.dataset.for),h=HINTS[st.hn%4];st.hn++;st.sw+=wc(h);el.value=(el.value.trim()?el.value.trim()+" ":"")+h+" ";el.focus();el.dispatchEvent(new Event("input"))},
send,
check:()=>{st.step=3;go("review")},
finish,
share:()=>{st.shared=true;save();drawCta();toast("Shared with your teacher")},
new:()=>go("home"),
rule:b=>{const i=+b.dataset.i;st.rules[i]=st.rules[i]?0:1;save();b.setAttribute("aria-checked",!!st.rules[i])},
export:()=>{const csv="Student,Words %,Steps,Time\n"+[...document.querySelectorAll(".tr")].map(r=>r.dataset.r).join("\n"),bad=()=>toast("Copy blocked. Select the table instead.");try{navigator.clipboard.writeText(csv).then(()=>toast("Report copied"),bad)}catch(e){bad()}}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener("keydown",e=>{if(e.key!="Enter")return;if(e.target.id=="msg")send();if(e.target.id=="topic")A.start()});
render();
</script>
</body>
</html>
